services:
  postgres:
    image: postgres:16
    container_name: es-ledger-postgres
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: es-ledger-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
    container_name: es-ledger-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
